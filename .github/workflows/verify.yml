name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile
        shell: pwsh

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.22.1 --locked
        shell: pwsh

      - name: License scan
        run: cargo deny --config config/deny.toml check licenses
        shell: pwsh

      - name: Verify
        run: bun run verify
        shell: pwsh
