name: ps-syntax

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse PowerShell scripts
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File ./scripts/check-syntax.ps1
