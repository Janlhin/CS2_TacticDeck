name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .deno-version

      - name: Install
        run: deno install --frozen
        shell: pwsh

      - name: Verify
        run: deno task verify
        shell: pwsh
